[project]
name = "email-agent-api"
version = "0.1.0"
description = "Email Agent FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.34.*",
    "pydantic==2.10.*",
    "pydantic-settings==2.6.*",
    "sqlalchemy==2.0.*",
    "alembic==1.14.*",
    "asyncpg==0.29.*",
    "python-jose[cryptography]==3.4.*",
    "httpx==0.28.*",
    "google-auth==2.35.*",
    "google-auth-oauthlib==1.2.*",
    "google-api-python-client==2.142.*",
    "cryptography==44.0.*",
    "python-multipart==0.0.*",
    "python-dotenv==1.0.*",
    "itsdangerous==2.2.*",
    "structlog==25.1.*",
    "prometheus-client==0.21.*",
    "pydantic-extra-types==2.10.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.*",
    "pytest-asyncio==0.24.*",
    "pytest-mock==3.14.*",
    "httpx==0.28.*",
    "ruff==0.8.*",
    "mypy==1.13.*",
]

[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PTH", "T20", "SIM", "RET", "PERF", "ARG"]
# B008: FastAPI's `Depends(...)` in defaults is the framework's idiom.
# ARG001/ARG002: protocol/interface implementations legitimately ignore args.
ignore = ["S101", "S603", "S607", "B008", "ARG001", "ARG002"]
fixable = ["F", "I", "N", "E", "W", "UP", "B", "C4", "PTH", "T20", "SIM", "RET", "PERF", "ARG"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
enable_error_code = ["unused-ignore", "return-value"]
exclude = ["tests/", "alembic/"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google.auth.*", "google_auth_oauthlib.*", "jose.*"]
ignore_missing_imports = true